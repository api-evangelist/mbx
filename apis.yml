name: MBX
description: >-
  MBX (formerly Memebox) is a global, multi-brand beauty and personal care
  company founded in 2012 and part of Y Combinator's Winter 2014 batch.
  Headquartered in San Francisco with operations in Seoul, Shanghai, and Taipei,
  MBX uses data-driven consumer insights and Korean beauty innovation to build
  and scale a portfolio of cosmetics brands — including Kaja, I Dew Care, Pony
  Effect, I'm Meme, and Nooni — sold through retail partners such as Sephora and
  Ulta. The company has raised over $190M from investors including Cowboy
  Ventures, Y Combinator, Formation 8, Goodwater Capital, Johnson & Johnson, and
  Pear VC. MBX operates as a direct-to-consumer and wholesale CPG business; it
  does not publish a public developer API.
